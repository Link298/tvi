<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ThaoVy✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d79;
            --soft-pink: #ffb3c1;
            --disney-magic: #d4af37;
            --deep-garden: #1a0008; 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--deep-garden);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .rose-field-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 25%, rgba(150, 0, 40, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 85% 75%, rgba(200, 20, 60, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(20, 0, 5, 1) 0%, transparent 100%);
            z-index: 0;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            flex-direction: column;
            pointer-events: none;
        }

        .start-btn {
            background: none;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .start-btn:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 60px rgba(212, 175, 55, 0.8));
        }

        .bouquet-icon {
            width: 280px;
            height: 280px;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
            animation: float 4s infinite ease-in-out;
            will-change: transform;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .btn-text {
            color: white;
            margin-top: -10px;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--disney-magic), #fff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        @keyframes shine {
            to { background-position: 200%; }
        }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        #runner-bear {
            position: absolute;
            top: 50%;
            left: 0;
            width: 200px;
            height: 200px;
            transform: translate3d(-300px, -50%, 0);
            z-index: 2;
            will-change: transform;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); 
        }

        .bear-svg {
            width: 100%;
            height: 100%;
            transform-origin: center bottom;
            transition: transform 0.25s ease-in-out; 
        }

        .moonwalking .bear-svg {
            transform: scaleX(-1) rotate(-3deg); 
        }

        .moonwalking #leg-l {
            animation: moonwalkLeg 1.2s infinite linear;
        }

        .moonwalking #leg-r {
            animation: moonwalkLeg 1.2s infinite linear 0.6s;
        }

        @keyframes moonwalkLeg {
            0%, 100% { transform: translateX(12px); }
            50% { transform: translateX(-12px); }
        }

        #card-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px; 
            transform: translate3d(-50%, -50%, 0) scale(0.1) rotate(-20deg); 
            opacity: 0;
            /* Hoạt ảnh bung hoa mượt mà, từ tốn hơn */
            transition: opacity 0.8s ease-out, transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1.05);
            z-index: 10;
            pointer-events: none; 
            will-change: transform, opacity;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-thrown {
            transform: translate3d(-50%, -50%, 0) scale(1) rotate(0deg) !important;
            opacity: 1 !important;
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6));
        }

        .ribbon-text-container {
            position: absolute;
            bottom: 70px; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20; 
        }

        .ribbon-banner {
            position: relative;
            width: 150%;
            max-width: 800px;
            height: 100px;
        }

        .typed-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; /* Khóa giới hạn chiều rộng để chữ luôn lọt trong ruy băng */
            font-family: 'Great Vibes', cursive; 
            font-size: 2.5rem; /* Kích thước chữ vừa vặn, không bị tràn */
            color: #4a0e2e;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
            z-index: 30; 
            display: flex;
            justify-content: center;
        }

        /* Các thẻ span chữ được khởi tạo sẵn chiếm chỗ, chỉ ẩn opacity để không bị co giãn */
        .char-span {
            opacity: 0;
            /* Trượt từ trái sang phải thay vì từ dưới lên */
            transform: translateX(-15px); 
            display: inline-block;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1.2);
        }

        .char-span.show {
            opacity: 1;
            transform: translateX(0);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 2.6rem;
            background-color: var(--disney-magic);
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
            box-shadow: 0 0 5px var(--disney-magic);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hidden { display: none !important; }
    </style>
</head>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const uiLayer = document.getElementById('ui');
        
        const sceneContainer = document.getElementById('scene-container');
        const runnerBear = document.getElementById('runner-bear');
        const bearHolding = document.getElementById('bear-holding');
        const bearThrown = document.getElementById('bear-thrown');
        const cardWrapper = document.getElementById('card-wrapper');
        const miniEnvelope = document.getElementById('mini-envelope'); 
        
        const typedText = document.getElementById('typedText');
        const cursor = document.getElementById('cursor');
        
        // Khai báo biến trỏ tới thẻ audio
        const bgMusic = document.getElementById('bgMusic');

        let width, height;
        let particles = [];
        let bokehParticles = [];
        let animationStarted = false;
        
        const MAX_PARTICLES = 250; 
        const BOKEH_COUNT = 100; 
        
        const flowerEmojis = ['✨', '🌟', '💫', '🌹', '🦋', '👑', '🪄'];

        class Bokeh {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 200 + 40; 
                this.color = this.getRandomColor();
                this.opacity = Math.random() * 0.25 + 0.05; 
                this.vx = (Math.random() - 0.5) * 0.3; 
                this.vy = (Math.random() - 0.5) * 0.3;
            }
            getRandomColor() {
                const colors = [
                    'rgba(255, 51, 102,', 
                    'rgba(255, 0, 64,',    
                    'rgba(255, 179, 193,', 
                    'rgba(179, 0, 45,'     
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -this.size) this.x = width + this.size;
                if (this.x > width + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = height + this.size;
                if (this.y > height + this.size) this.y = -this.size;
            }
            draw() {
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, this.color + this.opacity + ')');
                grad.addColorStop(0.5, this.color + (this.opacity * 0.5) + ')');
                grad.addColorStop(1, this.color + '0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor() {
                this.init(true);
                this.active = false;
            }
            init(isBurst = false) {
                if (isBurst) {
                    this.x = width / 2;
                    this.y = height / 2;
                    const angle = Math.random() * Math.PI * 2;
                    const force = Math.random() * 12 + 4;
                    this.vx = Math.cos(angle) * force;
                    this.vy = Math.sin(angle) * force;
                } else {
                    this.x = Math.random() * width;
                    this.y = -50;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * 2 + 0.5;
                }
                this.size = Math.random() * 25 + 15;
                this.emoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05; 
                this.swayAngle = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.03 + 0.01;
                this.active = true;
            }
            update() {
                if (!this.active) return;
                
                this.x += this.vx + Math.sin(this.swayAngle) * 1.5;
                this.y += this.vy;
                
                this.swayAngle += this.swaySpeed;
                this.rotation += this.rotationSpeed;
                
                this.vy += 0.02; 
                if (this.vy > 3.5) this.vy = 3.5; 
                
                this.vx *= 0.99; 
                
                if (this.y > height + 50) {
                    if (animationStarted) this.init(false);
                    else this.active = false;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.fillStyle = 'white';
                ctx.globalAlpha = 1;

                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        function initBokeh() {
            bokehParticles = [];
            for (let i = 0; i < BOKEH_COUNT; i++) {
                bokehParticles.push(new Bokeh());
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBokeh(); 
        }

        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < MAX_PARTICLES; i++) {
            particles.push(new Particle());
        }

        function launchBurst(count) {
            let triggered = 0;
            for (let p of particles) {
                if (!p.active && triggered < count) {
                    p.init(true);
                    triggered++;
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 0, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';
            for (let b of bokehParticles) {
                b.update();
                b.draw();
            }
            ctx.globalCompositeOperation = 'source-over';

            for (let p of particles) {
                p.update();
                p.draw();
            }
            
            if (animationStarted) {
                if (Math.random() > 0.4) {
                    for (let i = 0; i < MAX_PARTICLES; i++) {
                        if (!particles[i].active) {
                            particles[i].init(false);
                            break; 
                        }
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', () => {
            if (animationStarted) return;
            animationStarted = true;
            
            // Lệnh phát nhạc ngay khi vừa bấm nút (bắt được sự kiện tương tác của người dùng)
            bgMusic.play().catch(error => {
                console.log("Trình duyệt chặn tự động phát hoặc không tìm thấy file nhạc:", error);
            });
            
            uiLayer.style.transition = 'all 1s cubic-bezier(0.4, 0, 0.2, 1)';
            uiLayer.style.opacity = '0';
            uiLayer.style.transform = 'scale(1.5)';
            
            setTimeout(() => {
                uiLayer.classList.add('hidden');
                
                sceneContainer.classList.remove('hidden');
                
                void runnerBear.offsetWidth;
                
                runnerBear.classList.add('moonwalking');
                runnerBear.style.transition = 'transform 3s linear'; 
                runnerBear.style.transform = `translate3d(calc(50vw - 100px), -50%, 0)`;
                
                setTimeout(() => {
                    runnerBear.classList.remove('moonwalking');
                    
                    miniEnvelope.style.display = 'none';
                    bearHolding.style.display = 'none';
                    bearThrown.style.display = 'block';
                    
                    cardWrapper.classList.add('card-thrown');
                    
                    setTimeout(() => {
                         runnerBear.classList.add('moonwalking');
                         runnerBear.style.transition = 'transform 2.5s linear'; 
                         runnerBear.style.transform = `translate3d(120vw, -50%, 0)`; 
                    }, 800); 

                    // Delay cho bó hoa bay ra giữa rồi mới viết
                    setTimeout(startTyping, 1200);

                }, 3000); 

            }, 800);

            launchBurst(150);
        });

        // Tên cần viết trên ruy băng, dùng mảng để render sẵn vào DOM chống giật lag
        const message = "Xin dành tặng đến Thảo Vy 🌹✨";
        const messageArray = Array.from(message);
        let textIndex = 0;
        let charSpans = [];

        // In sẵn các thẻ con ra nhưng ẩn đi bằng CSS (opacity 0)
        // Việc này đảm bảo độ rộng của chữ được cấp phát trước, không bị co giãn khi gõ!
        typedText.innerHTML = '';
        messageArray.forEach(char => {
            let span = document.createElement('span');
            span.textContent = char === ' ' ? '\u00A0' : char; 
            span.className = 'char-span';
            typedText.appendChild(span);
            charSpans.push(span);
        });

        function startTyping() {
            if (textIndex < charSpans.length) {
                // Hiện dần từ trái sang phải
                charSpans[textIndex].classList.add('show');
                textIndex++;
                
                // TỐC ĐỘ: Tăng hơn 50% so với bản trước (Tốc độ giảm từ 160ms xuống 60ms)
                let typingSpeed = 30; 
                // Xử lý khoảng trắng nhanh hơn
                if (textIndex < charSpans.length && charSpans[textIndex - 1].textContent === '\u00A0') {
                    typingSpeed = 30;
                }
                
                setTimeout(startTyping, typingSpeed);
            } else {
                setTimeout(() => {
                    cursor.style.animation = 'none';
                    cursor.style.opacity = '0';
                    cursor.style.transition = 'opacity 1s ease';
                }, 1000);
            }
        }

        animate();
    </script>
</body>
